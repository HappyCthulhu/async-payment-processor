[project]
name = "async-payment-processor"
version = "0.1.0"
description = "Asynchronous payment processing service with transactional outbox"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.116",
    "faststream[rabbit]>=0.7.8",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "ty>=0.0.1a32",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["venv", "stubs", ".venv", "**/migrations/*.py", "alembic/versions/*.py"]

[tool.ruff.lint]
select = ["ALL"]
unfixable = ["ERA001", "COM819"]
ignore = [
    "Q",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "TD003",
    "TD002",
    "S101",
    "ANN002",
    "ANN003",
    "RUF001",
    "RUF003",
    "SLF001",
    "DJ001",
    "PGH004",
    "TRY003",
    "EM102",
    "RUF002",
    "FBT001",
    "FBT002",
    "ANN204",
    "BLE001",
    "EM101",
    "INP001",
    "D401",
    "CPY001",
    "COM812",
    "D203",
    "D211",
    "D213",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/payment_processor/api/schemas.py" = ["TC003"]
"src/payment_processor/api/dependencies.py" = ["TC003"]
"src/payment_processor/infrastructure/db/models.py" = ["TC003"]
"tests/**/*.py" = ["TC003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires PostgreSQL",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_processor"]
