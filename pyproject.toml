[project]
name = "async-payment-processor"
version = "0.1.0"
description = "Asynchronous payment processing service with transactional outbox"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.116",
    "faststream[rabbit]>=0.7.8",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "ty>=0.0.1a32",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_processor"]