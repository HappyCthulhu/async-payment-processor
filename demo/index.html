<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment demo</title><style>
body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;color:#202737}label{display:block;margin:.8rem 0}input,select,textarea,button{font:inherit;padding:.5rem}input,textarea{box-sizing:border-box;width:100%}button{cursor:pointer}pre{background:#f1f4f8;padding:1rem;overflow:auto;white-space:pre-wrap}small{color:#526077}
</style></head><body><h1>Payment demo</h1><p>Create a payment and watch its status and webhook.</p>
<form id="form"><label>Amount <input id="amount" value="1250.00" required></label><label>Currency <select id="currency"><option>RUB</option><option>USD</option><option>EUR</option></select></label><label>Description <input id="description" value="Order #42 payment"></label><label>Metadata (JSON) <textarea id="metadata">{"order_id":"42"}</textarea></label><label>Webhook URL <input id="webhook" value="http://webhook-sink:8080/callbacks/payments" required></label><label>Idempotency key <input id="key" required></label><button>Create payment</button></form>
<label>Payment ID <input id="paymentId"></label><button id="refresh">Refresh status and callbacks</button> <small>Callbacks refresh every 2 seconds; sink data is stored in memory.</small><h2>API response</h2><pre id="payment">—</pre><h2>Callbacks</h2><pre id="callbacks">—</pre>
<script>
const $=id=>document.getElementById(id); $('key').value=crypto.randomUUID();
async function show(response, target){const data=await response.json(); $(target).textContent=JSON.stringify(data,null,2); return {ok:response.ok,data};}
$('form').onsubmit=async e=>{e.preventDefault();try{const body={amount:$('amount').value,currency:$('currency').value,description:$('description').value,metadata:JSON.parse($('metadata').value),webhook_url:$('webhook').value};const result=await show(await fetch('/demo/payments',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':$('key').value},body:JSON.stringify(body)}),'payment');if(result.ok){$('paymentId').value=result.data.payment_id;$('key').value=crypto.randomUUID();}}catch(err){$('payment').textContent=String(err)}};
async function refresh(){try{if($('paymentId').value)await show(await fetch('/demo/payments/'+encodeURIComponent($('paymentId').value)),'payment');await show(await fetch('/callbacks'),'callbacks')}catch(err){$('callbacks').textContent=String(err)}}
$('refresh').onclick=refresh;setInterval(refresh,2000);refresh();
</script></body></html>
